<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS Semester Project</title>
    <link rel="stylesheet" href="project.css">
</head>

<body>
 
    <div id="loading-screen">
        <div class="loader-circle"></div>
        <p>Loading Scheduler...</p>
    </div>

     
    <div id="main-content" class="blurred">

        <h1>Preemptive Process Scheduling with Shortest Job First Algorithm</h1>

        <form action="#">
            <table>
                <thead>
                    <tr>
                        <th>Process</th>
                        <th>Arrival Time</th>
                        <th>Burst Time</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="process">
                        <td class="process-name">P 1</td>
                        <td><input type="number" class="arrival-time" value="1" id="A1" required></td>
                        <td><input type="number" class="burst-time" value="9" id="B1" required></td>
                    </tr>
                    <tr class="process">
                        <td class="process-name">P 2</td>
                        <td><input type="number" class="arrival-time" id="A2" value="5" required></td>
                        <td><input type="number" class="burst-time" id="B2" value="4" required></td>
                    </tr>
                    <tr class="process">
                        <td class="process-name">P 3</td>
                        <td><input type="number" class="arrival-time" id="A3" value="3" required></td>
                        <td><input type="number" class="burst-time" id="B3" value="2" required></td>
                    </tr>
                    <tr class="process">
                        <td class="process-name">P 4</td>
                        <td><input type="number" class="arrival-time" id="A4" value="4" required></td>
                        <td><input type="number" class="burst-time" id="B4" value="1" required></td>
                    </tr>
                    <tr class="process">
                        <td class="process-name">P 5</td>
                        <td><input type="number" class="arrival-time" id="A5" value="5" required></td>
                        <td><input type="number" class="burst-time" id="B5" value="3" required></td>
                    </tr>
                </tbody>
            </table>
            <button type="submit" id="execute-btn">Execute</button>
        </form>

        <section id="gantt-section">
            <h2 class="chart-headings">Initial Gantt Chart</h2>
            <div id="gantt-chart"></div>
        </section>

        <section id="final-gantt-section">
            <h2 class="chart-headings">Final Gantt Chart</h2>
            <div id="filtered-gantt-chart"></div>
        </section>

        <section id="stats">
            <table id="stats-table">
                <thead>
                    <tr>
                        <th>Process Name</th>
                        <th>Arrival Time</th>
                        <th>Burst Time</th>
                        <th>Waiting Time</th>
                        <th>Turnaround Time</th>
                        <th>Response Time</th>
                        <th>Completion Time</th>
                    </tr>
                </thead>
                <tbody id="stats-body">
                </tbody>
            </table>
        </section>

    </div> 
    
    <script src="project.js"></script>
</body>

</html>
