<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS Semester Project</title>
    <link rel="stylesheet" href="project.css">
</head>

<body>
    <h1>Preemptive Process Scheduling with Shortest Job First Algorithm</h1>
    <form action="#">
        <table>
            <thead>
                <tr>
                    <th>Process</th>
                    <th>Arrival Time</th>
                    <th>Burst Time</th>
                </tr>
            </thead>
            <tbody>
                <tr class="process">
                    <td class="process-name">P 1</td>
                    <td><input type="number" class="arrival-time" id="A1" required></td>
                    <td><input type="number" class="burst-time" id="B1" required></td>
                </tr>
                <tr class="process">
                    <td class="process-name">P 2</td>
                    <td><input type="number" class="arrival-time" id="A2" required></td>
                    <td><input type="number" class="burst-time" id="B2" required></td>
                </tr>
                <tr class="process">
                    <td class="process-name">P 3</td>
                    <td><input type="number" class="arrival-time" id="A3" required></td>
                    <td><input type="number" class="burst-time" id="B3" required></td>
                </tr>
                <tr class="process">
                    <td class="process-name">P 4</td>
                    <td><input type="number" class="arrival-time" id="A4" required></td>
                    <td><input type="number" class="burst-time" id="B4" required></td>
                </tr>
                <tr class="process">
                    <td class="process-name">P 5</td>
                    <td><input type="number" class="arrival-time" id="A5" required></td>
                    <td><input type="number" class="burst-time" id="B5" required></td>
                </tr>
            </tbody>
        </table>
        <button type="submit" id="execute-btn">Execute</button>
    </form>
    <section id="gantt-section">
        <h2 class="chart-headings">Initial Gantt Chart</h2>
        <div id="gantt-chart"></div>
    </section>
    <section id="final-gantt-section">
        <h2 class="chart-headings">Final Gantt Chart</h2>
        <div id="filtered-gantt-chart"></div>
    </section>
    <section id="stats">
            <table id="stats-table">
                <thead>
                    <tr>
                        <th>Process Name</th>
                        <th>Arrival Time</th>
                        <th>Burst Time</th>
                        <th>Waiting Time</th>
                        <th>Turnaround Time</th>
                        <th>Response Time</th>
                        <th>Completion Time</th>
                    </tr>
                </thead>
                <tbody id="stats-body">
                </tbody>
            </table>
        </section>

    </div> 
    
    <script src="project.js"></script>
</body>

</html>
